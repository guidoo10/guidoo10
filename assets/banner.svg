<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Terminal: kubectl get engineer anjul-singh">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111a2b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#326ce5"/>
      <stop offset="0.5" stop-color="#7b42bc"/>
      <stop offset="1" stop-color="#ff9900"/>
    </linearGradient>
    <clipPath id="c1"><rect x="40" y="70" height="30" width="0"><animate attributeName="width" from="0" to="820" begin="0.4s" dur="1.6s" fill="freeze" calcMode="discrete" values="0;60;120;180;240;300;360;420;480;540;600;660;720;820"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="108" height="80" width="0"><animate attributeName="width" from="0" to="820" begin="2.3s" dur="0.01s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="196" height="30" width="0"><animate attributeName="width" begin="2.9s" dur="1.4s" fill="freeze" calcMode="discrete" values="0;60;120;180;240;300;360;420;480;540;600;820"/></rect></clipPath>
    <clipPath id="c4"><rect x="40" y="232" height="30" width="0"><animate attributeName="width" from="0" to="820" begin="4.6s" dur="0.01s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="900" height="300" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="899" height="299" rx="14" fill="none" stroke="#30363d"/>
  <rect x="0" y="0" width="900" height="3" fill="url(#glow)" rx="1.5"/>

  <!-- window chrome -->
  <circle cx="28" cy="26" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="26" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="26" r="6" fill="#27c93f"/>
  <text x="450" y="31" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8b949e">anjul@prod-cluster: ~</text>
  <line x1="0" y1="48" x2="900" y2="48" stroke="#21262d"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">
    <g clip-path="url(#c1)">
      <text x="40" y="90"><tspan fill="#3fb950">$</tspan><tspan fill="#58a6ff" dx="10">~</tspan><tspan dx="10"> </tspan><tspan fill="#e6edf3">kubectl get engineer anjul-singh -o wide</tspan></text>
    </g>
    <g clip-path="url(#c2)">
      <text y="130" fill="#8b949e" font-size="14"><tspan x="40">NAME</tspan><tspan x="170">ROLE</tspan><tspan x="330">ORG</tspan><tspan x="420">EXP</tspan><tspan x="470">CERTS</tspan><tspan x="760">STATUS</tspan></text>
      <text y="156" fill="#e6edf3" font-size="14"><tspan x="40">anjul-singh</tspan><tspan x="170">DevOps Specialist</tspan><tspan x="330">Amdocs</tspan><tspan x="420">6y</tspan><tspan x="470">CKA · AWS DOP · AWS SAA · TF</tspan><tspan x="760" fill="#3fb950">Running ✓</tspan></text>
      <text x="40" y="180" fill="#8b949e" font-size="13"># telecom infra · Kubernetes in production · DevSecOps · platform engineering</text>
    </g>
    <g clip-path="url(#c3)">
      <text x="40" y="216"><tspan fill="#3fb950">$</tspan><tspan fill="#58a6ff" dx="10">~</tspan><tspan dx="10"> </tspan><tspan fill="#e6edf3">terraform apply -auto-approve</tspan></text>
    </g>
    <g clip-path="url(#c4)">
      <text x="40" y="252" font-size="14"><tspan fill="#3fb950">Apply complete!</tspan><tspan fill="#e6edf3"> Resources: </tspan><tspan fill="#ff9900">6 years</tspan><tspan fill="#e6edf3"> shipped, 0 outages left unexplained.</tspan></text>
    </g>
    <rect x="40" y="262" width="10" height="18" fill="#e6edf3" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="4.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
